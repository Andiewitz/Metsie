events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream Next.js frontend (client)
    upstream client_upstream {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # Upstream Django backend (services)
    upstream backend_upstream {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client Max Body Size (e.g. for avatar uploads)
        client_max_body_size 20M;

        # 1. Route API calls to Django services
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ensure 7-day httpOnly cookies pass through transparently
            proxy_pass_header Set-Cookie;
            proxy_pass_header Cookie;
        }

        # 2. Django Admin & Static files
        location /admin/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route all other traffic to Next.js client
        location / {
            proxy_pass http://client_upstream;
            proxy_http_version 1.1;

            # WebSocket support for Next.js HMR (Hot Module Replacement)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
