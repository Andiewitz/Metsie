[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:django]
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --timeout 120
directory=/app/services
environment=PYTHONPATH="/app/services",DJANGO_SETTINGS_MODULE="config.settings"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nextjs]
command=/app/client/node_modules/.bin/next start -p 3001
directory=/app/client
environment=PORT="3001",NODE_ENV="production",BACKEND_INTERNAL_URL="http://127.0.0.1:8000",NEXT_TELEMETRY_DISABLED="1"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
